.ring span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:.78rem;font-weight:600}

ul{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
ul::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--a),var(--b));opacity:.5;border-radius:2px}

@media (max-width:440px){form{grid-template-columns:1fr 1fr}form input[type=text]{grid-column:1/-1;order:3}.add{order:2}li{grid-template-columns:3.2em 1fr auto auto;padding:12px}}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.ring{transition:--p .7s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.panel{animation:rise .7s .34s cubic-bezier(.2,.7,.2,1) both}
.meter{animation:rise .7s .44s cubic-bezier(.2,.7,.2,1) both}
.big{animation:float 9s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(16px)}}
.add{position:relative;overflow:hidden}
.add::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
li{animation:none;transition:transform .2s,border-color .2s,box-shadow .2s}
li:hover{transform:translateX(5px);border-color:var(--a);box-shadow:0 8px 28px -12px var(--glow)}
li.fresh{animation:in .45s cubic-bezier(.2,.7,.2,1)}
li.bye{animation:bye .26s ease-in forwards}
@keyframes bye{to{opacity:0;transform:translateX(40px) scale(.96)}}
.chk.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.win{animation:win .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes win{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.tog{background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.9rem;color:var(--muted);transition:all .2s}
.tog[aria-pressed="true"]{color:var(--onA);border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b))}
select{font:inherit;font-size:.9rem;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
select option{color:#111}
.alert{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;display:flex;gap:14px;align-items:center;width:min(92vw,520px);padding:14px 16px;border-radius:16px;background:var(--a);color:var(--onA);box-shadow:0 14px 40px -10px var(--glow);animation:shake .5s ease-in-out infinite alternate}
.alert[hidden]{display:none}
.alert span{flex:1;font-weight:600}
.alert button{border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;background:#fff;color:#1a0508}
@keyframes shake{from{transform:translateX(-50%) rotate(-.6deg)}to{transform:translateX(-50%) rotate(.6deg)}}
.tabs{display:flex;gap:6px;margin-top:22px;padding:5px;border:1px solid var(--line);border-radius:99px;background:var(--surface);backdrop-filter:blur(12px);animation:rise .7s .3s cubic-bezier(.2,.7,.2,1) both}
.tabs button,.seg button{flex:1;border:0;border-radius:99px;padding:9px 14px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;transition:all .2s}
.tabs button.on,.seg button.on{color:var(--onA);background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px -10px var(--glow)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line)}
.seg button#mIn.on{background:#3fbf8a;color:#04140c;border-color:transparent;box-shadow:0 8px 24px -10px rgba(63,191,138,.6)}
#mf{grid-template-columns:1fr 1.3fr auto}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 8px;animation:rise .5s both}
.sum div{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);backdrop-filter:blur(10px);min-width:0}
.sum small{display:block;color:var(--muted);font-size:.78rem}
.sum b{display:block;font-family:Unbounded,system-ui,sans-serif;font-size:.8rem;font-weight:500;overflow-wrap:anywhere}
#sIn,.time.in{color:#5fd3a0}
#sOut,.time.out{color:var(--b)}
.note{color:var(--muted);font-size:.9rem;margin:0 2px 14px}
@media (max-width:440px){#mf{grid-template-columns:1fr}#mf input[type=text],#mf .add{grid-column:1/-1;order:0}}
.clock{margin:14px 0 0;color:var(--muted);font-size:.95rem}
.clock b{font-family:Unbounded,system-ui,sans-serif;font-weight:500;color:var(--ink);font-size:1.2rem;font-variant-numeric:tabular-nums;margin-right:10px;text-shadow:0 0 18px var(--glow)}
.stamp{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="bgimg" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="name" aria-hidden="true">Romo</div>
<main>
  <section class="hero">
    <div class="big" id="big" aria-hidden="true"></div>
    <div class="hero-in">
      <p class="kicker" id="kick"></p>
      <p class="date" style="margin:0 0 6px">Halo, Romo</p>
      <h1 id="day">Besok</h1>
      <p class="date" id="date"></p>
      <p class="clock" id="clock"></p>
    </div>
  </section>

  <nav class="tabs" aria-label="Menu"><button type="button" id="tAct" class="on">Kegiatan</button><button type="button" id="tMoney">Keuangan</button></nav>
  <div id="tabAct">
  <section class="panel">
    <form id="f">
      <input type="time" id="t" aria-label="Jam">
      <input type="text" id="x" placeholder="Apa yang mau dilakukan?" aria-label="Kegiatan" required maxlength="120" autocomplete="off">
      <button class="add" type="submit">Tambah</button>
    </form>
    <div class="row2"><label for="pick">Lihat tanggal lain</label><input type="date" id="pick"></div>
    <div class="row2"><button type="button" class="tog" id="bell" aria-pressed="false">Nada dering: mati</button><span><label for="lead">Bunyi </label><select id="lead"><option value="0">tepat waktu</option><option value="5">5 menit sebelum</option><option value="10">10 menit sebelum</option><option value="15">15 menit sebelum</option><option value="30">30 menit sebelum</option></select></span></div>
  </section>

  <div class="meter">
    <div class="ring" id="ring"><span id="pct">0%</span></div>
    <p><strong id="count">0 kegiatan</strong><span id="sub">Mulai dengan satu hal kecil.</span></p>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty">Belum ada rencana. Tulis kegiatan pertama untuk hari ini.</div>
  <div class="win" id="win">Semua beres. Selamat istirahat.</div>
  </div>
  <div id="tabMoney" hidden>
    <section class="panel">
      <div class="seg" role="group" aria-label="Jenis catatan"><button type="button" id="mIn" class="on" aria-pressed="true">Pemasukan</button><button type="button" id="mOut" aria-pressed="false">Pengeluaran</button></div>
      <form id="mf"><input type="text" id="mn" inputmode="numeric" placeholder="Nominal, mis. 50.000" required aria-label="Nominal dalam rupiah" autocomplete="off"><input type="text" id="mk" placeholder="Keterangan" maxlength="80" aria-label="Keterangan" autocomplete="off"><button class="add" type="submit">Catat</button></form>
    </section>
    <div class="sum"><div><small>Pemasukan</small><b id="sIn">Rp0</b></div><div><small>Pengeluaran</small><b id="sOut">Rp0</b></div><div><small>Saldo</small><b id="sBal">Rp0</b></div></div>
    <p class="note" id="mnote"></p>
    <ul id="mlist"></ul>
    <div class="empty" id="mempty">Belum ada catatan keuangan di tanggal ini.</div>
  </div>
  <div class="alert" id="alert" role="alert" hidden><span id="atxt"></span><button type="button" id="astop">Matikan</button></div>
</main>

<script>
(function(){
  var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var KEY="kegiatan-v1",data={};
  try{var raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)||{};}catch(e){data={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  function iso(d){var m=d.getMonth()+1,g=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(g<10?"0":"")+g;}
  var now=new Date(),tmr=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  var tmrIso=iso(tmr),cur=tmrIso,flash=null,fresh=null,$=function(i){return document.getElementById(i);};
  $("pick").value=cur;

  function kick(){
    var n=new Date();
    if(cur!==iso(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1))){$("kick").textContent="Rencana harian";return;}
    var mid=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),mnt=Math.max(0,Math.floor((mid-n)/60000));
    $("kick").innerHTML="Dimulai dalam <b>"+Math.floor(mnt/60)+" jam "+(mnt%60)+" menit</b>";
  }
  function render(){
    var p=cur.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
    $("day").textContent=cur===tmrIso?"Besok":cur===iso(now)?"Hari ini":HARI[d.getDay()];
    $("date").textContent=HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();
    $("big").textContent=d.getDate();kick();renderM();
    var items=(data[cur]||[]).slice().sort(function(a,b){return (a.t||"99:99").localeCompare(b.t||"99:99");});
    var ul=$("list");ul.innerHTML="";var done=0;
    items.forEach(function(it){
      if(it.d)done++;
      var li=document.createElement("li");li.className=(it.d?"done ":"")+(it===fresh?"fresh":"");
      var t=document.createElement("span");t.className="time";t.textContent=it.t||"Bebas";
      var x=document.createElement("span");x.className="txt";x.textContent=it.x;
      var c=document.createElement("input");c.type="checkbox";c.className="chk";c.checked=!!it.d;c.setAttribute("aria-label","Selesai: "+it.x);if(it===flash)c.className+=" pop";
      c.onchange=function(){it.d=c.checked;if(it.d)flash=it;save();render();};
      var b=document.createElement("button");b.className="del";b.type="button";b.textContent="×";b.setAttribute("aria-label","Hapus "+it.x);
      b.onclick=function(){li.classList.add("bye");setTimeout(function(){data[cur]=data[cur].filter(function(o){return o!==it;});save();render();},260);};
      li.appendChild(t);li.appendChild(x);li.appendChild(c);li.appendChild(b);ul.appendChild(li);
    });
    flash=fresh=null;var pc=items.length?Math.round(done/items.length*100):0;
    $("ring").style.setProperty("--p",pc);$("pct").textContent=pc+"%";
    $("count").textContent=items.length+" kegiatan";
    $("sub").textContent=!items.length?"Mulai dengan satu hal kecil.":done===items.length?"Semuanya selesai.":(items.length-done)+" lagi yang tersisa.";
    $("empty").style.display=items.length?"none":"block";
    $("win").style.display=items.length&&done===items.length?"block":"none";
  }
  $("f").onsubmit=function(e){
    e.preventDefault();var x=$("x").value.trim();if(!x)return;
    var nw={x:x,t:$("t").value,d:false};(data[cur]=data[cur]||[]).push(nw);fresh=nw;
    save();$("x").value="";$("x").focus();render();
  };
  $("pick").onchange=function(){if($("pick").value){cur=$("pick").value;render();}};
  var mon={},mtype='in',MK='keuangan-v1';
  try{var rm=localStorage.getItem(MK);if(rm)mon=JSON.parse(rm)||{};}catch(e){mon={};}
  function saveM(){try{localStorage.setItem(MK,JSON.stringify(mon));}catch(e){}}
  function rp(n){return 'Rp'+Math.round(n).toLocaleString('id-ID');}
  function neg(n){return (n<0?'-':'')+rp(Math.abs(n));}
  function sumOf(arr,t){return arr.reduce(function(s,o){return o.t===t?s+o.n:s;},0);}
  function renderM(){
    var arr=mon[cur]||[],i=sumOf(arr,'in'),o=sumOf(arr,'out'),ti=0,to=0;
    Object.keys(mon).forEach(function(k){ti+=sumOf(mon[k],'in');to+=sumOf(mon[k],'out');});
    $('sIn').textContent=rp(i);$('sOut').textContent=rp(o);$('sBal').textContent=neg(i-o);
    $('mnote').textContent='Saldo seluruh catatan: '+neg(ti-to);
    var ul=$('mlist');ul.innerHTML='';
    arr.forEach(function(it){
      var li=document.createElement('li'),s=document.createElement('span'),x=document.createElement('span'),a=document.createElement('span'),b=document.createElement('button');
      s.className='time '+(it.t==='in'?'in':'out');s.textContent=it.t==='in'?'+':'\u2212';
      x.className='txt';x.textContent=it.k||(it.t==='in'?'Pemasukan':'Pengeluaran');
      if(it.w){var q=new Date(it.w),w=document.createElement('small');w.className='stamp';w.textContent='Dicatat '+q.getDate()+' '+BULAN[q.getMonth()]+' '+q.getFullYear()+', pukul '+p2(q.getHours())+':'+p2(q.getMinutes());x.appendChild(w);}
      a.className='time '+(it.t==='in'?'in':'out');a.textContent=rp(it.n);
      b.className='del';b.type='button';b.textContent='\u00d7';b.setAttribute('aria-label','Hapus catatan');
      b.onclick=function(){li.classList.add('bye');setTimeout(function(){mon[cur]=mon[cur].filter(function(q){return q!==it;});saveM();renderM();},260);};
      li.appendChild(s);li.appendChild(x);li.appendChild(a);li.appendChild(b);ul.appendChild(li);
    });
    $('mempty').style.display=arr.length?'none':'block';
  }
  function setType(t){mtype=t;$('mIn').className=t==='in'?'on':'';$('mOut').className=t==='out'?'on':'';$('mIn').setAttribute('aria-pressed',t==='in');$('mOut').setAttribute('aria-pressed',t==='out');}
  $('mIn').onclick=function(){setType('in');};$('mOut').onclick=function(){setType('out');};
  $('mn').oninput=function(){var d=this.value.replace(/\D/g,'').slice(0,12);this.value=d?Number(d).toLocaleString('id-ID'):'';};
  $('mf').onsubmit=function(e){e.preventDefault();var n=parseInt($('mn').value.replace(/\D/g,''),10);if(!n)return;
    (mon[cur]=mon[cur]||[]).push({t:mtype,n:n,k:$('mk').value.trim(),w:Date.now()});saveM();$('mn').value='';$('mk').value='';$('mn').focus();renderM();};
  function tab(m){$('tabAct').hidden=m;$('tabMoney').hidden=!m;$('tAct').className=m?'':'on';$('tMoney').className=m?'on':'';}
  $('tAct').onclick=function(){tab(false);};$('tMoney').onclick=function(){tab(true);};
  function p2(v){return v<10?'0'+v:''+v;}
  function tick(){var n=new Date();$('clock').innerHTML='<b>'+p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds())+'</b>Sekarang, '+HARI[n.getDay()]+' '+n.getDate()+' '+BULAN[n.getMonth()]+' '+n.getFullYear();}
  setInterval(tick,1000);tick();
  var set={on:false,lead:10};
  try{var rs=localStorage.getItem('kegiatan-set');if(rs)set=JSON.parse(rs)||set;}catch(e){}
  function saveSet(){try{localStorage.setItem('kegiatan-set',JSON.stringify(set));}catch(e){}}
  var ac=null,ringT=null;
  function ctx(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac;}
  function chime(){var c=ctx();if(!c)return;var t0=c.currentTime;[880,1108.7,1318.5,1760].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),s=t0+i*0.16;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.35,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.7);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+0.75);});}
  function stopRing(){if(ringT){clearInterval(ringT);ringT=null;}}
  function startRing(){stopRing();chime();var n=0;ringT=setInterval(function(){n++;if(n>=12){stopRing();return;}chime();try{if(navigator.vibrate)navigator.vibrate(300);}catch(e){}},1500);}
  var bell=$('bell'),lead=$('lead');lead.value=String(set.lead);
  function paintBell(){bell.setAttribute('aria-pressed',set.on?'true':'false');bell.textContent='Nada dering: '+(set.on?'aktif':'mati');}
  bell.onclick=function(){set.on=!set.on;saveSet();paintBell();if(set.on){chime();try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}else{stopRing();$('alert').hidden=true;}};
  lead.onchange=function(){set.lead=+lead.value;saveSet();};
  $('astop').onclick=function(){stopRing();$('alert').hidden=true;};
  document.addEventListener('pointerdown',function(){if(set.on)ctx();});
  function check(){
    if(!set.on)return;
    var n=new Date(),arr=data[iso(n)]||[],hits=[];
    arr.forEach(function(it){
      if(!it.t||it.d||it.al)return;
      var h=it.t.split(':'),at=new Date(n.getFullYear(),n.getMonth(),n.getDate(),+h[0],+h[1]),diff=(at-n)/60000;
      if(diff<=set.lead&&diff>-30){it.al=true;hits.push(it);}
    });
    if(!hits.length)return;
    save();
    var msg=(set.lead>0?'Sebentar lagi, pukul ':'Sekarang, pukul ')+hits[0].t+': '+hits[0].x+(hits.length>1?' (+'+(hits.length-1)+' lainnya)':'');
    $('atxt').textContent=msg;$('alert').hidden=false;startRing();
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Pengingat kegiatan',{body:msg});}catch(e){}
  }
  paintBell();setInterval(check,15000);check();
  var pt=$("petals");
  for(var i=0;i<16;i++){var s=document.createElement("i"),z=7+Math.random()*9;
    s.style.left=(Math.random()*100)+"%";s.style.width=z+"px";s.style.height=z*1.2+"px";
    s.style.animationDuration=(11+Math.random()*12)+"s";s.style.animationDelay=(-Math.random()*20)+"s";pt.appendChild(s);}
  setInterval(kick,60000);render();
})();
</script>
